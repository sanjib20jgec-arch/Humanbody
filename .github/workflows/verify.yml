name: Human Biology Lab verification

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hbl-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    name: Static contracts and production build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run static verification
        run: npm run verify:static

  visual-contracts:
    name: Responsive visual gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: static-contracts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and Linux libraries
        run: npx playwright install --with-deps chromium
      - name: Build production preview
        run: npm run build
      - name: Run required responsive visual gate
        run: npm run verify:visual
      - name: Upload visual gate screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-gate-${{ github.run_attempt }}
          path: test-results/visual-gate/
          if-no-files-found: ignore
          retention-days: 14

  browser-contracts:
    name: Chromium contracts (${{ matrix.project }}, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Keep SwiftShader serial within each runner; split the 122 tests into small
    # independent shards to limit renderer-resource growth and stay under timeout.
    timeout-minutes: 30
    needs: static-contracts
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-phone]
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and Linux libraries
        run: npx playwright install --with-deps chromium
      - name: Run browser verification
        run: npm run verify:browser -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/4
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
